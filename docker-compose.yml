services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_secret_password@db:5432/gold_peacock?schema=public
      - ADMIN_API_KEY=${ADMIN_API_KEY:-test-admin-secret-key-change-me}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - DRIVE_SYNC_INTERVAL_MINUTES=${DRIVE_SYNC_INTERVAL_MINUTES:-60}
      - AUTO_PUBLISH=${AUTO_PUBLISH:-true}
    depends_on:
      db:
        condition: service_healthy

  sync-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ["node", "scripts/sync-drive.js", "--watch"]
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_SITE_URL=http://app:3000
      - ADMIN_API_KEY=${ADMIN_API_KEY:-test-admin-secret-key-change-me}
      - DRIVE_SYNC_INTERVAL_MINUTES=${DRIVE_SYNC_INTERVAL_MINUTES:-60}
      - AUTO_PUBLISH=${AUTO_PUBLISH:-true}
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret_password
      POSTGRES_DB: gold_peacock
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
